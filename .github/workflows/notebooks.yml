name: Notebooks

on:
  push:
    branches: [main]
    paths: ["notebooks/**"]
  pull_request:
    branches: [main]
    paths: ["notebooks/**"]
  workflow_dispatch:

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nbconvert jupyter

      - name: Validate notebooks
        run: |
          for notebook in notebooks/*.ipynb; do
            echo "Validating $notebook..."
            jupyter nbconvert --to script --stdout "$notebook" > /dev/null 2>&1 || echo "Warning: $notebook has syntax issues"
          done