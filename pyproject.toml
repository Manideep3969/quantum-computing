[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-compiler"
version = "0.1.0"
description = "Hardware-aware quantum circuit optimization framework bridging classical compilation techniques to NISQ devices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Manideep"},
]
keywords = ["quantum", "computing", "circuit", "optimization", "NISQ", "qiskit"]

[project.urls]
Homepage = "https://github.com/Manideep3969/quantum-computing"
Repository = "https://github.com/Manideep3969/quantum-computing"
Issues = "https://github.com/Manideep3969/quantum-computing/issues"
Changelog = "https://github.com/Manideep3969/quantum-computing/blob/main/CHANGELOG.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.29",
    "qiskit-aer>=0.14",
    "cirq>=1.3",
    "pennylane>=0.34",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.6",
    "jupyter>=1.0",
    "notebook>=7.0",
]
docs = [
    "jupyter>=1.0",
    "notebook>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["qc_compiler"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]